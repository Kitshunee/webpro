<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tugas2.css">
</head>
<body>
    <h2>Hubungi Saya</h2>
<form id="formKontak" novalidate>
  <div>
    <label for="nama">Nama:</label><br>
    <input type="text" id="nama" placeholder="Nama lengkap">
    <div id="namaError" class="error"></div>
  </div>

  <div>
    <label for="email">Email:</label><br>
    <input type="email" id="email" placeholder="contoh@email.com">
    <div id="emailError" class="error"></div>
  </div>

  <div>
    <label for="pesan">Pesan:</label><br>
    <textarea id="pesan" rows="4" placeholder="Tulis pesan Anda"></textarea>
    <div id="pesanError" class="error"></div>
  </div>

  <button type="submit">Kirim</button>
</form>
</body>
<script src="tugas3.js"></script>
</html>
